name: Link rot sweep

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-rot-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check every link in README.md
        id: check
        run: |
          # Exit 1 means dead/suspect links only if a complete, consistent JSON
          # report was produced. Other failures must fail the job.
          set +e
          python3 scripts/check_readme.py check-links --all --state .github/link-rot-state.json --json > /tmp/results.json
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import json, sys
          with open('/tmp/results.json', encoding='utf-8') as f:
              data = json.load(f)
          results, stats = data['results'], data['stats']
          assert data['generated_from'] == 'all' and isinstance(results, list)
          classes = ('OK', 'HARD_DEAD', 'SUSPECT', 'BLOCKED')
          assert all(r['class'] in classes for r in results)
          assert stats == {'total': len(results), **{c.lower(): sum(r['class'] == c for r in results) for c in classes}}
          expected = 1 if stats['hard_dead'] or stats['suspect'] else 0
          assert int(sys.argv[1]) == expected, 'link checker failed unexpectedly'
          PY
          cp .github/link-rot-state.json /tmp/link-rot-state.json

      - name: Commit updated sweep state
        id: state
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- .github/link-rot-state.json; then
            echo "No state changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/link-rot-state.json
            git commit -m "chore(link-rot): update sweep state [skip ci]"
            git pull --rebase origin "$REF_NAME"
            git push origin "HEAD:$REF_NAME"
          fi

      - name: Render report body
        id: report
        if: always() && steps.check.outcome == 'success'
        run: |
          python3 scripts/check_readme.py report --results /tmp/results.json --state /tmp/link-rot-state.json > /tmp/report-body.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/report-body.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace("Please open a pull request to fix an entry -- don't reply here with fixes, this issue body is fully rewritten on every run.", "Please open a pull request to fix an entry.")
          path.write_text(text, encoding='utf-8')
          PY

      - name: Publish job summary
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          STATE_OUTCOME: ${{ steps.state.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('# Link rot sweep\n\n')
              summary.write('Automatic fix PR creation is disabled to protect the existing automated/link-rot-fixes branch. Please review and fix links manually.\n\n')
              summary.write(f"Check: {os.environ['CHECK_OUTCOME']}; state commit: {os.environ['STATE_OUTCOME']}; report: {os.environ['REPORT_OUTCOME']}.\n\n")
              if os.environ['CHECK_OUTCOME'] == 'success':
                  stats = json.loads(Path('/tmp/results.json').read_text(encoding='utf-8'))['stats']
                  summary.write('Stats: ' + ', '.join(f'{k}: {v}' for k, v in stats.items()) + '\n\n')
              if os.environ['REPORT_OUTCOME'] == 'success':
                  report = Path('/tmp/report-body.md').read_text(encoding='utf-8')
                  summary.write(report[:50000])
                  if len(report) > 50000:
                      summary.write('\n\n_Report truncated in summary; see the link-rot-report artifact for the full report._\n')
              summary.write('\n\nFull report and raw results, when available, are in the link-rot-report artifact.\n')
          PY

      - name: Upload full report and raw results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: link-rot-report
          path: |
            /tmp/results.json
            /tmp/report-body.md
            /tmp/link-rot-state.json
          if-no-files-found: warn
